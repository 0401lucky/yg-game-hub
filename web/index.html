<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf8f3">
    <title>游戏大厅</title>
    <link rel="stylesheet" href="/css/hub.css">
    <link rel="stylesheet" href="/css/account.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
</head>

<body>
    <div class="hub-wrap">
        <header class="hub-head">
            <h1 class="hub-title"><span id="hubTitle">游戏大厅</span><span class="hub-dot">.</span></h1>
            <p class="hub-subtitle" id="hubSubtitle">自己开的几个小游戏，和朋友联机用</p>

            <div class="hub-status">
                <span class="hub-pill"><span class="hub-live"></span>服在线</span>
                <span class="hub-pill">在线玩家 <b id="hubPlayers">-</b></span>
                <span class="hub-pill">进行中房间 <b id="hubRooms">-</b></span>
            </div>

            <p class="hub-subtitle" id="hubGreeting" style="margin-top:14px;"></p>
        </header>

        <main id="hubGames"></main>

        <footer class="hub-foot">
            <span>© 2026 · Made with ♥ by lucky</span>
            <span>
                <a href="/api/rooms" target="_blank" rel="noopener">房间列表</a>
                ·
                <a href="/games/flight/admin.html" target="_blank" rel="noopener">运营面板</a>
            </span>
        </footer>
    </div>

    <script src="/js/account.js" defer></script>
    <script src="/js/hub.js" defer></script>
</body>

</html>
